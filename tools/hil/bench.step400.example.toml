# HIL test bench configuration for the STEP400_R1.
# Copy to bench.step400.toml (gitignored), edit, and run with
#   .venv/bin/python hil.py --config bench.step400.toml <command>
# Keys left out take the values of this file, then of bench.example.toml (STEP800).
# Firmware: step400_devlib_probe (-D STEP400_R1 -D HIL_PROBE, platformio_local.ini).

[board]
model = "step400"
# DIP switch ID. The firmware defaults give the same addresses as on the STEP800:
# 10.0.0.100 + id, receive port 50000, send port 50100 + id.
id = 1

[motor]
# Motor (1-4) whose OUT1A goes to Scope 1 and whose limit / home switch inputs go to
# DIO 14 / 15.
test_axis = 1
motor_connected = false

[ad2.dio]
# Brake outputs EM_1-EM_4 (J7-1 to J7-4, in parallel with the Brake Board), motor n on
# DIO n-1. HIGH = released, LOW = engaged.
brake = [0, 1, 2, 3]
# P0 D38 (J8-5) on DIO 8, P1 SCL (J8-4) on DIO 9, P2 SDA (J8-3) on DIO 10. The
# STEP400_R1 has no pin for P3-P6 (src/hilProbe.h): -1.
probes = [8, 9, 10, -1, -1, -1, -1]
# 3.3 V (J8-2). Checked high at the start of every recording (wiring), and its rise is
# the power-up reference of hil.py powerup.
v33 = 4
# Limit switch (CN1-CN4 pin 2, ADCIN through 100 ohm) and home switch (CN5-CN8 pin 2, SW
# through 100 ohm) of the test axis, open-drain: low = pressed, high impedance =
# released. Leave pin 3 (5 V) of both connectors unconnected. Only 14 and 15.
limit_sw = 14
home_sw = 15

[ad2.scope]
out1a = 1
# The 3.3 V is on DIO 4; Scope 2 always stays on P0 (D38, in parallel with DIO 8).
v33 = 0
p0_ref = 2
range_vpp = 50.0

[excitation]
# Not measured on the STEP400 (PowerSTEP01) yet: the STEP800 (L6470) values. Measure
# with "selftest --only excitation" (Task 3) and write the STEP400 values here, in
# bench.step400.toml, with the reason.
level_v = 3.0
hysteresis_v = 1.0
window_ms = 1.0
min_edges = 10
clamp_v = 0.9
hiz_median_v = [1.5, 2.1]
