# HIL test bench configuration.
# Copy to bench.toml (gitignored) and edit. Keys left out use the defaults shown here.

[board]
# DIP switch ID of the STEP800. With the firmware defaults (no config file on the SD
# card), the network settings follow from it:
#   IP address    10.0.0.100 + id    (myIp, isMyIpAddId = true)
#   receive port  50000              (inPort, the ID is not added)
#   send port     50100 + id         (outPort, isOutPortAddId = true)
#   subnet        255.255.255.0
# A config file on the SD card (config.txt, or the first *.json) can change all of
# these; then set ip / in_port / out_port explicitly.
id = 1
# ip = "10.0.0.101"
# in_port = 50000
# out_port = 50101
# The firmware sends replies only after /setDestIp (unless canSendMsgBeforeDestIp is
# set in the config file). The bench sends /setDestIp at start and checks that the
# reply names this Mac. The Mac needs an address in the board's subnet (10.0.0.x).

[serial]
# USB serial port of the STEP800. Empty: auto-detect /dev/cu.usbmodem* (it is an error
# if there is none or more than one).
port = ""

[motor]
# Motor (1-8) connected to the test axis.
test_axis = 1

[ad2]
# Path of the WaveForms runtime. Empty: /Library/Frameworks/dwf.framework/dwf, then
# /Applications/WaveForms.app/Contents/Frameworks/dwf.framework/dwf.
# The environment variable DWF_LIBRARY overrides this.
dwf_library = ""
# Serial number of the Analog Discovery 2. Empty: the first one found.
serial_number = ""

[ad2.dio]
# AD2 DIO number connected to the brake output of each motor, index 0 = motor 1.
# TODO(Task 3): the J2 pin of each motor is not confirmed yet. This assumes
# DIO n = J2 pin n+1 = motor n+1.
brake = [0, 1, 2, 3, 4, 5, 6, 7]
# AD2 DIO number of each probe, index 0 = P0.
probes = [8, 9, 10, 11, 12, 13, 14]
# Home switch of the test axis (open-drain, low = pressed). Must be 15; the bench
# refuses to drive any other pin.
home_sw = 15

[ad2.scope]
# Scope channels (1 or 2).
out1a = 1   # OUT1A of the test axis
v33 = 2     # 3.3 V of the board (power-up test)
# Input range in volts peak-to-peak: 50 = +/-25 V.
range_vpp = 50.0

[timing]
# Processing time measurement (hil.py timing).
digital_rate = 1e6
duration = 60.0
# Load: servo mode on all motors, /setTargetPositionList at target_rate_hz (a sine
# around the current position on the test axis, 0 on the others), position reports
# of all motors every position_report_ms.
# TODO(Task 4): match position_report_ms to the procedure of STATUS chapter 7.
target_rate_hz = 100.0
sine_amplitude = 1280   # microsteps (10 full steps at 1/128)
sine_period = 2.0       # seconds
position_report_ms = 20

[brake]
# Brake scenarios (hil.py brake).
digital_rate = 1e5
analog_rate = 2e5
transition_ms = 100
# Allowed brake output delay added to transition_ms for INV-2.
latency_allowance_ms = 30
kval = 16
max_speed = 200.0
position_poll_ms = 20

[excitation]
# Excitation detection on OUT1A: hysteresis comparator, edges counted per window.
# TODO(Task 3): set from measurements with /hardStop (excited) and /hardHiZ.
level_v = 6.0
hysteresis_v = 2.0
window_ms = 1.0
min_edges = 4

[sync]
# Start time of the Scope minus start time of Digital In, in seconds (measured in
# Task 3). Added to the Scope sample times.
scope_minus_digital_s = 0.0
