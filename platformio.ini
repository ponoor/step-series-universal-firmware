[platformio]
; Optional, untracked file for local development (see TASK_devlib_setup.md).
; It is ignored when the file does not exist.
extra_configs = platformio_local.ini
; Plain "pio run" builds the firmware of both products only (not zeroUSB, which is
; the same as step400, nor the native test env, which has no main()).
default_envs = step400, step800

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Settings shared by all SAMD boards. Not an [env], so it is not inherited by
; other environments (e.g. a future native test env). Driver libraries are added per env.
[samd_base]
platform = atmelsam
board = zeroUSB
framework = arduino
build_flags =
	-D SDFAT_FILE_TYPE=1
	-D USE_LONG_FILE_NAMES=1
lib_deps =
	arduino-libraries/Ethernet@^2.0.2
	greiman/SdFat@^2.2.3
	bblanchon/ArduinoJson@^7.4.1
; There are no on-target tests; host tests run with "pio test -e native".
test_ignore = *

; TODO(release): after tagging v1.2.0 of both driver libraries, update these references
; (L6470 ZIP URL to the v1.2.0 tag, PowerSTEP01 to ^1.2.0).
; Until then, builds that use the 1.2.0 API (packed transfers etc.) require the
; *_devlib environments in platformio_local.ini.
[env:step400]
extends = samd_base
build_flags =
	${samd_base.build_flags}
	-D STEP400_R1
lib_deps =
	${samd_base.lib_deps}
	ponoor/Ponoor PowerSTEP01 Library@^1.1.0

[env:step800]
extends = samd_base
build_flags =
	${samd_base.build_flags}
	-D STEP800_R1
lib_deps =
	${samd_base.lib_deps}
	https://github.com/ponoor/Ponoor_L6470_Library/archive/refs/tags/v1.1.0.zip
	; ponoor/Ponoor L6470 Library @ ^1.1.0

; Kept for compatibility: same as step400.
[env:zeroUSB]
extends = env:step400

; Host unit tests: pio test -e native
; Builds only the sources that do not depend on Arduino. Does not extend samd_base.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<oscParser.cpp> +<oscWriter.cpp> +<oscRouter.cpp> +<oscArgs.cpp> +<OSCMatch.c> +<resetCause.cpp> +<brakeControl.cpp> +<latchedReport.cpp> +<sendBackoff.cpp> +<elapsedMs.cpp> +<homingTimeout.cpp> +<arpResolve.cpp> +<idOffset.cpp> +<servoSwitch.cpp>

